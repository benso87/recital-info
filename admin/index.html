<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recital Admin</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #111;
      color: #eee;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    h1 {
      font-size: 1.2rem;
      font-weight: 600;
      color: #aaa;
      margin-bottom: 32px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .card {
      background: #1e1e1e;
      border-radius: 16px;
      padding: 32px 24px;
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    label {
      font-size: 0.85rem;
      color: #888;
      display: block;
      margin-bottom: 8px;
    }

    input[type="password"],
    input[type="number"] {
      width: 100%;
      background: #2a2a2a;
      border: 1px solid #3a3a3a;
      border-radius: 10px;
      color: #eee;
      font-size: 1.1rem;
      padding: 14px 16px;
      outline: none;
      transition: border-color 0.15s;
    }

    input[type="password"]:focus,
    input[type="number"]:focus {
      border-color: #666;
    }

    button {
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      transition: opacity 0.15s, transform 0.1s;
    }

    button:active {
      opacity: 0.8;
      transform: scale(0.97);
    }

    .btn-primary {
      background: #4a90e2;
      color: #fff;
      font-size: 1.1rem;
      padding: 14px;
      width: 100%;
    }

    .btn-increment {
      background: #27ae60;
      color: #fff;
      font-size: 2.5rem;
      font-weight: 700;
      padding: 28px;
      width: 100%;
      line-height: 1;
      border-radius: 14px;
    }

    .btn-decrement {
      background: #c0392b;
      color: #fff;
      font-size: 2.5rem;
      font-weight: 700;
      padding: 28px;
      width: 100%;
      line-height: 1;
      border-radius: 14px;
    }

    .btn-set {
      background: #e67e22;
      color: #fff;
      font-size: 1.1rem;
      padding: 14px 24px;
      flex-shrink: 0;
      border-radius: 10px;
    }

    .current-display {
      text-align: center;
    }

    .current-label {
      font-size: 0.85rem;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 4px;
    }

    .current-number {
      font-size: 5rem;
      font-weight: 700;
      color: #fff;
      line-height: 1;
    }

    .set-row {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .set-row input {
      flex: 1;
    }

    .status {
      font-size: 0.9rem;
      text-align: center;
      min-height: 1.4em;
      color: #aaa;
    }

    .status.success { color: #2ecc71; }
    .status.error   { color: #e74c3c; }

    #lock-section,
    #admin-section { width: 100%; max-width: 360px; }

    #admin-section { display: none; }
  </style>
</head>
<body>
  <h1>Recital Admin</h1>

  <div id="lock-section" class="card">
    <div>
      <label for="key-input">Secret Key</label>
      <input type="password" id="key-input" placeholder="Enter key" autocomplete="off">
    </div>
    <button class="btn-primary" id="unlock-btn">Unlock</button>
  </div>

  <div id="admin-section" class="card">
    <div class="current-display">
      <div class="current-label">Current Performance</div>
      <div class="current-number" id="current-number">—</div>
    </div>

    <button class="btn-increment" id="increment-btn">+1</button>
    <button class="btn-decrement" id="decrement-btn">−1</button>

    <div>
      <label>Jump to performance #</label>
      <div class="set-row">
        <input type="number" id="set-input" min="0" placeholder="e.g. 12">
        <button class="btn-set" id="set-btn">Set</button>
      </div>
    </div>

    <div class="status" id="status"></div>
  </div>

  <script>
    const WORKER = 'https://recital-now.benso87.workers.dev';

    let secretKey = '';

    const lockSection  = document.getElementById('lock-section');
    const adminSection = document.getElementById('admin-section');
    const keyInput     = document.getElementById('key-input');
    const unlockBtn    = document.getElementById('unlock-btn');
    const currentNum   = document.getElementById('current-number');
    const incrementBtn = document.getElementById('increment-btn');
    const setInput     = document.getElementById('set-input');
    const setBtn       = document.getElementById('set-btn');
    const statusEl     = document.getElementById('status');

    function setStatus(msg, type = '') {
      statusEl.textContent = msg;
      statusEl.className = 'status ' + type;
    }

    async function fetchCurrent() {
      try {
        const res = await fetch(`${WORKER}/current`);
        const data = await res.json();
        currentNum.textContent = data.current ?? '?';
        return data.current;
      } catch {
        currentNum.textContent = '?';
        return null;
      }
    }

    async function setPerformance(n) {
      const url = `${WORKER}/set?n=${encodeURIComponent(n)}&key=${encodeURIComponent(secretKey)}`;
      const res = await fetch(url);
      if (res.status === 401 || res.status === 403) {
        throw new Error('Unauthorized');
      }
      if (!res.ok) {
        throw new Error(`Error ${res.status}`);
      }
      return n;
    }

    unlockBtn.addEventListener('click', () => {
      const val = keyInput.value.trim();
      if (!val) return;
      secretKey = val;
      lockSection.style.display = 'none';
      adminSection.style.display = 'flex';
      fetchCurrent();
    });

    keyInput.addEventListener('keydown', e => {
      if (e.key === 'Enter') unlockBtn.click();
    });

    const decrementBtn = document.getElementById('decrement-btn');

    decrementBtn.addEventListener('click', async () => {
      decrementBtn.disabled = true;
      try {
        const current = await fetchCurrent();
        if (current === null) {
          setStatus('Could not read current value', 'error');
          return;
        }
        const next = Math.max(0, current - 1);
        await setPerformance(next);
        currentNum.textContent = next;
        setStatus(`Updated to ${next}`, 'success');
      } catch (err) {
        const msg = err.message === 'Unauthorized'
          ? 'Unauthorized — check your key'
          : `Error: ${err.message}`;
        setStatus(msg, 'error');
        await fetchCurrent();
      } finally {
        decrementBtn.disabled = false;
      }
    });

    incrementBtn.addEventListener('click', async () => {
      incrementBtn.disabled = true;
      try {
        const current = await fetchCurrent();
        if (current === null) {
          setStatus('Could not read current value', 'error');
          return;
        }
        const next = current + 1;
        await setPerformance(next);
        currentNum.textContent = next;
        setStatus(`Updated to ${next}`, 'success');
      } catch (err) {
        const msg = err.message === 'Unauthorized'
          ? 'Unauthorized — check your key'
          : `Error: ${err.message}`;
        setStatus(msg, 'error');
        await fetchCurrent();
      } finally {
        incrementBtn.disabled = false;
      }
    });

    setBtn.addEventListener('click', async () => {
      const val = parseInt(setInput.value, 10);
      if (isNaN(val) || val < 0) {
        setStatus('Enter a valid number', 'error');
        return;
      }
      setBtn.disabled = true;
      try {
        await setPerformance(val);
        currentNum.textContent = val;
        setStatus(`Updated to ${val}`, 'success');
        setInput.value = '';
      } catch (err) {
        const msg = err.message === 'Unauthorized'
          ? 'Unauthorized — check your key'
          : `Error: ${err.message}`;
        setStatus(msg, 'error');
        await fetchCurrent();
      } finally {
        setBtn.disabled = false;
      }
    });

    setInput.addEventListener('keydown', e => {
      if (e.key === 'Enter') setBtn.click();
    });
  </script>
</body>
</html>
