<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Career Day — Spring Recital 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-page:       #f5f0eb;
      --bg-card:       #ffffff;
      --bg-subtle:     #f1efe8;
      --bg-hover:      #e8e5df;
      --border-main:   #b4b2a9;
      --border-light:  #d3d1c7;
      --text-primary:  #1a1a18;
      --text-secondary:#888780;
      --text-muted:    #b4b2a9;

      --multi-bg:       #E1F5EE;
      --multi-bg-hover: #9FE1CB;
      --multi-text:     #085041;
      --multi-meta:     #0F6E56;

      --finale-bg:       #E1F5EE;
      --finale-bg-hover: #9FE1CB;
      --finale-text:     #085041;
      --finale-meta:     #0F6E56;

      --toggle-bg:     #1a1a18;
      --toggle-text:   #f5f0eb;
    }

    [data-theme="dark"] {
      --bg-page:       #0e0e0d;
      --bg-card:       #1c1c1a;
      --bg-subtle:     #252523;
      --bg-hover:      #2e2e2b;
      --border-main:   #444441;
      --border-light:  #333331;
      --text-primary:  #f0ede8;
      --text-secondary:#888780;
      --text-muted:    #5f5e5a;

      --multi-bg:       #072e22;
      --multi-bg-hover: #0a4232;
      --multi-text:     #9FE1CB;
      --multi-meta:     #5DCAA5;

      --finale-bg:       #072e22;
      --finale-bg-hover: #0a4232;
      --finale-text:     #9FE1CB;
      --finale-meta:     #5DCAA5;

      --toggle-bg:     #f0ede8;
      --toggle-text:   #1a1a18;
    }

    body {
      font-family: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg-page);
      color: var(--text-primary);
      min-height: 100vh;
      padding: 1rem;
      transition: background 0.25s, color 0.25s;
    }

    .toggle-bar {
      max-width: 680px;
      margin: 0 auto 1rem;
    }

    .toggle-btn {
      width: 100%;
      padding: 0.9rem 1.25rem;
      background: var(--toggle-bg);
      color: var(--toggle-text);
      border: none;
      border-radius: 10px;
      font-family: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: background 0.25s, color 0.25s, opacity 0.15s;
      letter-spacing: 0.01em;
      -webkit-tap-highlight-color: transparent;
    }

    .toggle-btn:active { opacity: 0.75; }
    .toggle-icon { font-size: 20px; line-height: 1; }

    /* ── Selector widget ── */
    .selector-bar {
      max-width: 680px;
      margin: 0 auto 1rem;
      position: relative;
    }

    .selector-field {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      min-height: 48px;
      padding: 8px 12px;
      background: var(--bg-card);
      border: 1.5px solid var(--border-main);
      border-radius: 10px;
      cursor: text;
      transition: border-color 0.15s, background 0.25s;
    }

    .selector-field:focus-within {
      border-color: var(--text-secondary);
    }

    .selector-input {
      flex: 1;
      min-width: 140px;
      border: none;
      outline: none;
      background: transparent;
      font-family: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 15px;
      color: var(--text-primary);
      padding: 2px 0;
    }

    .selector-input::placeholder { color: var(--text-muted); }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 8px 3px 10px;
      border-radius: 20px;
      font-family: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
      font-weight: 500;
      white-space: nowrap;
      background: var(--chip-bg, #ddd);
      color: var(--chip-text, #333);
      line-height: 1.4;
    }

    .chip-x {
      cursor: pointer;
      font-size: 15px;
      line-height: 1;
      opacity: 0.65;
      padding: 0 1px;
      background: none;
      border: none;
      color: inherit;
      font-family: inherit;
    }

    .chip-x:hover { opacity: 1; }

    .selector-dropdown {
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      right: 0;
      background: var(--bg-card);
      border: 1.5px solid var(--border-main);
      border-radius: 10px;
      max-height: 240px;
      overflow-y: auto;
      z-index: 100;
      box-shadow: 0 4px 16px rgba(0,0,0,0.12);
      display: none;
    }

    .selector-dropdown.open { display: block; }

    .dd-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 14px;
      font-family: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 14px;
      cursor: pointer;
      color: var(--text-primary);
      transition: background 0.1s;
    }

    .dd-item:hover, .dd-item.focused { background: var(--bg-hover); }

    .dd-item.selected { font-weight: 500; }

    .dd-check {
      width: 16px;
      height: 16px;
      border-radius: 4px;
      border: 1.5px solid var(--border-main);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
    }

    .dd-item.selected .dd-check {
      background: var(--chip-bg, #ddd);
      border-color: transparent;
      color: var(--chip-text, #333);
    }

    .dd-empty {
      padding: 12px 14px;
      font-family: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
      color: var(--text-muted);
      font-style: italic;
    }

    /* ── Program ── */
    .program {
      max-width: 680px;
      margin: 0 auto;
      background: var(--bg-card);
      border-radius: 12px;
      border: 0.5px solid var(--border-light);
      padding: 0 0 2.5rem;
      transition: background 0.25s, border-color 0.25s;
    }

    .header {
      text-align: center;
      padding: 2rem 1.5rem 1.5rem;
      border-bottom: 2px solid var(--border-main);
      margin-bottom: 1.25rem;
    }

    .title-sub {
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--text-secondary);
      margin: 0 0 0.4rem;
      font-family: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    .title-main {
      font-size: 26px;
      font-weight: 500;
      margin: 0 0 0.3rem;
      color: var(--text-primary);
    }

    .title-year {
      font-size: 13px;
      color: var(--text-secondary);
      font-family: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    .legend {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
      margin: 0 1rem 1.25rem;
      padding: 0.65rem 1rem;
      background: var(--bg-subtle);
      border-radius: 8px;
    }

    .legend:empty { display: none; }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-family: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: var(--text-primary);
    }

    .legend-dot { width: 12px; height: 12px; border-radius: 3px; flex-shrink: 0; }

    .act-header {
      font-family: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 11px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      font-weight: 500;
      color: var(--text-muted);
      padding: 0.5rem 1rem;
      margin: 1rem 0 0;
      border-top: 0.5px solid var(--border-light);
    }

    .intermission {
      text-align: center;
      font-size: 11px;
      font-family: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-muted);
      padding: 0.8rem 0;
      border-top: 0.5px dashed var(--border-light);
      border-bottom: 0.5px dashed var(--border-light);
      margin: 0.4rem 1rem;
    }

    .row {
      display: grid;
      grid-template-columns: 34px 1fr auto;
      align-items: baseline;
      gap: 0 10px;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      margin: 0 0.25rem;
      transition: background 0.15s;
    }

    .row:hover { background: var(--bg-hover); }

    .row-num {
      font-size: 12px;
      font-family: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: var(--text-muted);
      text-align: right;
    }

    .row-song { font-size: 15px; color: var(--text-primary); }

    .row-group {
      font-size: 12px;
      font-family: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: var(--text-secondary);
      text-align: right;
      white-space: nowrap;
    }

    /* Highlighted rows — color vars injected per-slot by JS */
    .hl-multi { background: var(--multi-bg) !important; }
    .hl-multi:hover { background: var(--multi-bg-hover) !important; }
    .hl-multi .row-num, .hl-multi .row-group { color: var(--multi-meta); }
    .hl-multi .row-song { color: var(--multi-text); font-weight: 500; }

    .hl-1 { background: var(--hl1-bg); }
    .hl-1:hover { background: var(--hl1-bg-hover); }
    .hl-1 .row-num, .hl-1 .row-group { color: var(--hl1-meta); }
    .hl-1 .row-song { color: var(--hl1-text); }

    .hl-2 { background: var(--hl2-bg); }
    .hl-2:hover { background: var(--hl2-bg-hover); }
    .hl-2 .row-num, .hl-2 .row-group { color: var(--hl2-meta); }
    .hl-2 .row-song { color: var(--hl2-text); }

    .hl-3 { background: var(--hl3-bg); }
    .hl-3:hover { background: var(--hl3-bg-hover); }
    .hl-3 .row-num, .hl-3 .row-group { color: var(--hl3-meta); }
    .hl-3 .row-song { color: var(--hl3-text); }

    .hl-4 { background: var(--hl4-bg); }
    .hl-4:hover { background: var(--hl4-bg-hover); }
    .hl-4 .row-num, .hl-4 .row-group { color: var(--hl4-meta); }
    .hl-4 .row-song { color: var(--hl4-text); }

    .hl-5 { background: var(--hl5-bg); }
    .hl-5:hover { background: var(--hl5-bg-hover); }
    .hl-5 .row-num, .hl-5 .row-group { color: var(--hl5-meta); }
    .hl-5 .row-song { color: var(--hl5-text); }

    .hl-6 { background: var(--hl6-bg); }
    .hl-6:hover { background: var(--hl6-bg-hover); }
    .hl-6 .row-num, .hl-6 .row-group { color: var(--hl6-meta); }
    .hl-6 .row-song { color: var(--hl6-text); }

    .hl-7 { background: var(--hl7-bg); }
    .hl-7:hover { background: var(--hl7-bg-hover); }
    .hl-7 .row-num, .hl-7 .row-group { color: var(--hl7-meta); }
    .hl-7 .row-song { color: var(--hl7-text); }

    .hl-8 { background: var(--hl8-bg); }
    .hl-8:hover { background: var(--hl8-bg-hover); }
    .hl-8 .row-num, .hl-8 .row-group { color: var(--hl8-meta); }
    .hl-8 .row-song { color: var(--hl8-text); }

    .sel-row {
      display: flex;
      gap: 8px;
      align-items: flex-start;
    }

    .sel-row .selector-field { flex: 1; }

    .clear-btn {
      flex-shrink: 0;
      padding: 0 16px;
      height: 48px;
      background: var(--bg-card);
      color: var(--text-secondary);
      border: 1.5px solid var(--border-main);
      border-radius: 10px;
      font-family: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
      display: none;
    }

    .clear-btn.visible { display: flex; align-items: center; }
    .clear-btn:hover { background: var(--bg-hover); color: var(--text-primary); border-color: var(--text-secondary); }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 200;
      display: none;
    }

    .modal-overlay.open { display: flex; }

    .modal-box {
      background: var(--bg-card);
      border: 1px solid var(--border-main);
      border-radius: 14px;
      padding: 1.5rem 1.75rem;
      max-width: 340px;
      width: calc(100% - 2rem);
      font-family: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      box-shadow: 0 8px 32px rgba(0,0,0,0.2);
    }

    .modal-msg {
      font-size: 15px;
      color: var(--text-primary);
      margin-bottom: 1.25rem;
      line-height: 1.5;
    }

    .modal-btns {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
    }

    .modal-btn {
      padding: 0.5rem 1.25rem;
      border-radius: 8px;
      border: 1.5px solid var(--border-main);
      font-family: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
    }

    .modal-btn-no  { background: var(--bg-subtle); color: var(--text-primary); }
    .modal-btn-no:hover  { background: var(--bg-hover); }
    .modal-btn-yes { background: var(--text-primary); color: var(--bg-page); border-color: transparent; }
    .modal-btn-yes:hover { opacity: 0.85; }

    .tag {
      display: inline-flex;
      align-items: center;
      font-size: 10px;
      font-family: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      letter-spacing: 0.06em;
      font-weight: 500;
      padding: 2px 6px;
      border-radius: 4px;
      margin-left: 5px;
      vertical-align: middle;
      text-transform: uppercase;
    }

    @media (max-width: 480px) {
      .row { grid-template-columns: 28px 1fr; }
      .row-group { display: none; }
      .title-main { font-size: 22px; }
      .legend { gap: 10px; }
    }
  </style>
</head>

    {num:20, song:"“Yodel-Adle-Eedle-Idle-Oo”", group:"Jr. MT jazz",     act:2, dancers:GROUPS["Cattle Wranglers"]},
    {num:21, song:"“Opening Up”",            group:"Sr. MT tap",          act:2, dancers:GROUPS["Waitress"]},
    {num:22, song:"“Jennie”",                group:"Nicole & Mariska",act:2, dancers:["Nicole Poterbin","Mariska Rader"]},
    {num:23, song:"“Love You Left Behind”",  group:"Mara Hilliard",       act:2, dancers:["Mara Hilliard"]},
    {num:24, song:"“Fashion”",               group:"Hannah & Gracie",act:2, dancers:["Hannah Watkins","Gracie Smith"]},
    {num:25, song:"“Madness”",               group:"Fashion Models",      act:2, dancers:GROUPS["Fashion Models"]},
    {num:26, song:"“Beetlejuice”",           group:"Kelli, Sara & Autumn", act:2, dancers:["Kelli Hibler","Sara Benson","Autumn Foster"]},
    {num:27, song:"“Abracadabra”",           group:"HS jazz",             act:2, dancers:GROUPS["Magicians"]},
    {num:28, song:"“Walk Like A Dinosaur”",  group:"Tumbling",            act:2, dancers:GROUPS["Animal Wranglers"]},
    {num:29, song:"“Center Stage Diner”",    group:"Int. Hip Hop",        act:2, dancers:GROUPS["Servers"]},
    {num:30, song:"“Money”",                 group:"Sr. MT jazz",         act:2, dancers:GROUPS["Waitress"]},
    {num:31, song:"RIOT",                              group:"RIOT",                act:3, dancers:GROUPS["RIOT"]},
    {num:32, song:"“Light”",                 group:"Addison & Hannah",act:3, dancers:["Addison Watkins","Hannah Watkins"]},
    {num:33, song:"“A Million Dreams”",      group:"Classical Ballet",    act:3, dancers:GROUPS["Dreamers"]},
    {num:34, song:"“2 StepN”",               group:"Jr. MT tap",          act:3, dancers:GROUPS["Cattle Wranglers"]},
    {num:35, song:"“Defying Gravity”",       group:"Madilynn McElroy",    act:3, dancers:["Madilynn McElroy"]},
    {num:36, song:"“Lovesick”",              group:"Hannah Watkins",      act:3, dancers:["Hannah Watkins"]},
    {num:37, song:"“Bring ‘Em Out”",    group:"Kaylea Burgess",      act:3, dancers:["Kaylea Burgess"]},
    {num:38, song:"“To Build A Home”",       group:"9–10 lyrical",   act:3, dancers:GROUPS["All Business"]},
    {num:39, song:"“Imagine”",               group:"6–8 lyrical",    act:3, dancers:GROUPS["RACERS"]},
    {num:40, song:"“Hometown Glory”",        group:"HS contemporary",     act:3, dancers:GROUPS["Magicians"]},
    {num:41, song:"“Fatherman”",             group:"Young Adults",        act:3, dancers:GROUPS["Stock Brokers"]},
    {num:42, song:"FINALE",                            group:"All Dancers",         act:3, finale:true, dancers:[]}
  ];

  // Build unique dancer list sorted by last name
  var _seen = {};
  var ALL_DANCERS = [];
  NUMBERS.forEach(function(n) {
    n.dancers.forEach(function(d) {
      if (!_seen[d]) { _seen[d] = true; ALL_DANCERS.push(d); }
    });
  });
  // Also pull all group members (some may not appear in NUMBERS directly)
  Object.keys(GROUPS).forEach(function(g) {
    GROUPS[g].forEach(function(d) {
      if (!_seen[d]) { _seen[d] = true; ALL_DANCERS.push(d); }
    });
  });
  ALL_DANCERS.sort(function(a, b) {
    function lastName(n) {
      var parts = n.trim().split(/\s+/);
      return parts[parts.length - 1].toLowerCase();
    }
    var la = lastName(a), lb = lastName(b);
    return la < lb ? -1 : la > lb ? 1 : 0;
  });

  // ── Color palette ─────────────────────────────────────────────────────────
  var PALETTE = [
    // [light-bg, light-bg-hover, light-text, light-meta, dark-bg, dark-bg-hover, dark-text, dark-meta, dot-color]
    ["#FAECE7","#F5C4B3","#712B13","#993C1D", "#3d1a0e","#5a2513","#F5C4B3","#F0997B", "#F0997B"],
    ["#EEEDFE","#CECBF6","#3C3489","#534AB7", "#1e1b40","#2d2860","#CECBF6","#AFA9EC", "#AFA9EC"],
    ["#FEF3E2","#FAD897","#6B3A00","#8A5200", "#2e1f05","#452f08","#FAC775","#EF9F27", "#EF9F27"],
    ["#FCE8F3","#F4BADE","#7B1553","#9E2068", "#3a0d28","#561240","#F7CEED","#EE8DD0", "#EE8DD0"],
    ["#E8F4FD","#B3DCF5","#1a4f6e","#226690", "#0e2a3a","#163d52","#93D4F0","#5DBFE8", "#5DBFE8"],
    ["#EDFAE1","#C5EFA4","#2d5a12","#3d7a18", "#162e08","#223f0c","#A8E97B","#87D44E", "#87D44E"],
    ["#FDF0F0","#F5C0C0","#7a1c1c","#9e2424", "#3a0d0d","#521212","#F5AAAA","#EC7979", "#EC7979"],
    ["#F0F0FF","#C8C8FF","#2a2a8a","#3838aa", "#0d0d3a","#141452","#ADADFF","#8080FF", "#8080FF"]
  ];

  // ── State ─────────────────────────────────────────────────────────────────
  var selected = []; // array of dancer names in order selected
  var colorMap = {}; // dancer name -> palette index (1-based)
  var nextColor = 0;

  function getColorIndex(name) {
    if (!colorMap[name]) {
      nextColor = (nextColor % PALETTE.length) + 1;
      colorMap[name] = nextColor;
    }
    return colorMap[name];
  }

  // ── CSS variable injection ────────────────────────────────────────────────
  var styleEl = document.createElement('style');
  document.head.appendChild(styleEl);

  function updateCSSVars() {
    var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    var lines = [':root {'];
    for (var i = 1; i <= PALETTE.length; i++) {
      var p = PALETTE[i - 1];
      var bg      = isDark ? p[4] : p[0];
      var bgHover = isDark ? p[5] : p[1];
      var text    = isDark ? p[6] : p[2];
      var meta    = isDark ? p[7] : p[3];
      lines.push(
        '--hl'+i+'-bg:'+bg+';',
        '--hl'+i+'-bg-hover:'+bgHover+';',
        '--hl'+i+'-text:'+text+';',
        '--hl'+i+'-meta:'+meta+';'
      );
    }
    lines.push('}');
    styleEl.textContent = lines.join('\n');
  }

  // ── Row rendering ─────────────────────────────────────────────────────────
  function renderRows() {
    var container = document.getElementById('program-rows');
    var html = '';
    var currentAct = 0;

    NUMBERS.forEach(function(n) {
      if (n.act !== currentAct) {
        if (currentAct > 0) {
          html += '<div class="intermission">&mdash; 10 Minute Intermission &mdash;</div>';
        }
        html += '<div class="act-header">Act ' + n.act + '</div>';
        currentAct = n.act;
      }

      var hlClass = getRowHighlight(n);
      html += '<div class="row' + (hlClass ? ' ' + hlClass : '') + '" data-num="' + n.num + '">';
      html += '<span class="row-num">' + n.num + '</span>';
      var tags = '';
      if (selected.length > 0) {
        var matchingSelected = n.finale
          ? finaleSelected()
          : selected.filter(function(s) { return n.dancers.indexOf(s) !== -1; });
        var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
        matchingSelected.forEach(function(name) {
          var idx = getColorIndex(name);
          var p = PALETTE[idx - 1];
          var tagBg   = isDark ? p[5] : p[1];
          var tagText = isDark ? p[7] : p[3];
          var firstName = name.split(' ')[0];
          tags += '<span class="tag" style="background:' + tagBg + ';color:' + tagText + '">' + firstName + '</span>';
        });
      }
      html += '<span class="row-song">' + n.song + tags + '</span>';
      html += '<span class="row-group">' + n.group + '</span>';
      html += '</div>';
    });

    container.innerHTML = html;
  }

  function isRiotOnly(name) {
    var inRiot = false;
    for (var i = 0; i < NUMBERS.length; i++) {
      var entry = NUMBERS[i];
      if (entry.finale) continue;
      if (entry.dancers.indexOf(name) === -1) continue;
      if (entry.num === 31) { inRiot = true; continue; }
      return false; // appears in a number other than RIOT
    }
    return inRiot;
  }

  function finaleSelected() {
    return selected.filter(function(s) { return !isRiotOnly(s); });
  }

  function getRowHighlight(n) {
    if (selected.length === 0) return '';
    if (n.finale) {
      var fs = finaleSelected();
      if (fs.length === 0) return '';
      if (fs.length === 1) return 'hl-' + getColorIndex(fs[0]);
      return 'hl-multi';
    }

    var matchingSelected = selected.filter(function(s) {
      return n.dancers.indexOf(s) !== -1;
    });

    if (matchingSelected.length === 0) return '';
    if (matchingSelected.length > 1) return 'hl-multi';
    return 'hl-' + getColorIndex(matchingSelected[0]);
  }

  // ── Legend rendering ──────────────────────────────────────────────────────
  function renderLegend() {
    var legend = document.getElementById('legend');
    if (selected.length === 0) { legend.innerHTML = ''; return; }

    var html = '';
    selected.forEach(function(name) {
      var idx = getColorIndex(name);
      var p = PALETTE[idx - 1];
      var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      var dotColor = p[8];
      html += '<div class="legend-item">';
      html += '<div class="legend-dot" style="background:' + dotColor + '"></div>';
      html += name;
      html += '</div>';
    });

    if (selected.length > 1) {
      html += '<div class="legend-item">';
      html += '<div class="legend-dot" style="background:#5DCAA5"></div>';
      html += 'Multiple';
      html += '</div>';
    }

    legend.innerHTML = html;
  }

  // ── Selector widget ───────────────────────────────────────────────────────
  var ddOpen = false;
  var ddFocusIdx = -1;
  var filterText = '';

  function buildSelector() {
    var bar = document.getElementById('selector-bar');
    bar.innerHTML =
      '<div class="sel-row">' +
        '<div class="selector-field" id="sel-field">' +
          '<div id="sel-chips"></div>' +
          '<input class="selector-input" id="sel-input" type="text" placeholder="Search for a dancer…" autocomplete="off" />' +
        '</div>' +
        '<button class="clear-btn" id="clear-btn" onclick="showClearModal()">Clear</button>' +
      '</div>' +
      '<div class="selector-dropdown" id="sel-dropdown"></div>';

    document.getElementById('sel-field').addEventListener('click', function(e) {
      if (e.target.classList.contains('chip-x')) return;
      document.getElementById('sel-input').focus();
      openDropdown();
    });

    var input = document.getElementById('sel-input');
    input.addEventListener('input', function() {
      filterText = this.value;
      ddFocusIdx = -1;
      renderDropdown();
      openDropdown();
    });

    input.addEventListener('keydown', function(e) {
      var items = getFilteredDancers();
      if (e.key === 'ArrowDown') {
        e.preventDefault();
        ddFocusIdx = Math.min(ddFocusIdx + 1, items.length - 1);
        renderDropdown();
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        ddFocusIdx = Math.max(ddFocusIdx - 1, -1);
        renderDropdown();
      } else if (e.key === 'Enter') {
        e.preventDefault();
        if (ddFocusIdx >= 0 && ddFocusIdx < items.length) {
          toggleDancer(items[ddFocusIdx]);
        }
      } else if (e.key === 'Escape') {
        closeDropdown();
        input.blur();
      }
    });

    input.addEventListener('focus', function() { openDropdown(); });

    document.addEventListener('click', function(e) {
      if (!document.getElementById('selector-bar').contains(e.target)) {
        closeDropdown();
      }
    });

    renderChips();
    renderDropdown();
  }

  function getFilteredDancers() {
    if (!filterText) return ALL_DANCERS;
    var q = filterText.toLowerCase();
    return ALL_DANCERS.filter(function(d) { return d.toLowerCase().indexOf(q) !== -1; });
  }

  function renderDropdown() {
    var dd = document.getElementById('sel-dropdown');
    var items = getFilteredDancers();
    if (items.length === 0) {
      dd.innerHTML = '<div class="dd-empty">No dancers found</div>';
      return;
    }
    var html = '';
    items.forEach(function(name, i) {
      var isSel = selected.indexOf(name) !== -1;
      var isFocused = i === ddFocusIdx;
      var idx = isSel ? getColorIndex(name) : 0;
      var p = idx ? PALETTE[idx - 1] : null;
      var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      var checkStyle = p ? ('background:' + (isDark ? p[4] : p[0]) + ';border-color:' + (isDark ? p[6] : p[2]) + ';color:' + (isDark ? p[6] : p[2])) : '';
      html += '<div class="dd-item' + (isSel ? ' selected' : '') + (isFocused ? ' focused' : '') + '" data-name="' + name.replace(/"/g,'&quot;') + '">';
      html += '<div class="dd-check" style="' + checkStyle + '">' + (isSel ? '&#10003;' : '') + '</div>';
      html += name;
      html += '</div>';
    });
    dd.innerHTML = html;

    dd.querySelectorAll('.dd-item').forEach(function(el) {
      el.addEventListener('mousedown', function(e) {
        e.preventDefault();
        toggleDancer(el.getAttribute('data-name'));
      });
    });

    if (ddFocusIdx >= 0) {
      var focused = dd.querySelectorAll('.dd-item')[ddFocusIdx];
      if (focused) focused.scrollIntoView({block:'nearest'});
    }
  }

  function renderChips() {
    var chips = document.getElementById('sel-chips');
    var html = '';
    selected.forEach(function(name) {
      var idx = getColorIndex(name);
      var p = PALETTE[idx - 1];
      var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      var bg   = isDark ? p[4] : p[0];
      var text = isDark ? p[6] : p[2];
      html += '<span class="chip" style="--chip-bg:' + bg + ';--chip-text:' + text + '">';
      html += name;
      html += '<button class="chip-x" data-name="' + name.replace(/"/g,'&quot;') + '" aria-label="Remove ' + name + '">&times;</button>';
      html += '</span>';
    });
    chips.innerHTML = html;

    chips.querySelectorAll('.chip-x').forEach(function(btn) {
      btn.addEventListener('click', function(e) {
        e.stopPropagation();
        toggleDancer(btn.getAttribute('data-name'));
      });
    });

    var clearBtn = document.getElementById('clear-btn');
    if (clearBtn) {
      if (selected.length > 0) clearBtn.classList.add('visible');
      else clearBtn.classList.remove('visible');
    }
  }

  function showClearModal() {
    document.getElementById('clear-modal').classList.add('open');
  }

  function closeClearModal() {
    document.getElementById('clear-modal').classList.remove('open');
  }

  function confirmClear() {
    selected = [];
    colorMap = {};
    nextColor = 0;
    saveState();
    closeClearModal();
    renderChips();
    renderDropdown();
    renderLegend();
    renderRows();
  }

  function toggleDancer(name) {
    var idx = selected.indexOf(name);
    if (idx === -1) {
      selected.push(name);
      getColorIndex(name);
    } else {
      selected.splice(idx, 1);
      delete colorMap[name];
      nextColor = 0;
      // Reassign colors in order
      colorMap = {};
      nextColor = 0;
      selected.forEach(function(d) { getColorIndex(d); });
    }
    saveState();
    renderChips();
    renderDropdown();
    renderLegend();
    renderRows();
  }

  function openDropdown() {
    ddOpen = true;
    renderDropdown();
    document.getElementById('sel-dropdown').classList.add('open');
  }

  function closeDropdown() {
    ddOpen = false;
    document.getElementById('sel-dropdown').classList.remove('open');
    filterText = '';
    document.getElementById('sel-input').value = '';
    ddFocusIdx = -1;
  }

  // ── Persistence ───────────────────────────────────────────────────────────
  function saveState() {
    try { localStorage.setItem('recital-highlights', JSON.stringify(selected)); } catch(e){}
  }

  function loadState() {
    try {
      var saved = localStorage.getItem('recital-highlights');
      if (saved) {
        var names = JSON.parse(saved);
        names.forEach(function(name) {
          if (ALL_DANCERS.indexOf(name) !== -1 && selected.indexOf(name) === -1) {
            selected.push(name);
            getColorIndex(name);
          }
        });
      }
    } catch(e){}
  }

  // ── Theme toggle ──────────────────────────────────────────────────────────
  var html = document.documentElement;
  var icon = document.getElementById('toggle-icon');
  var label = document.getElementById('toggle-label');
  var savedTheme = localStorage.getItem('recital-theme');
  if (savedTheme) { html.setAttribute('data-theme', savedTheme); }

  function toggleTheme() {
    var next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    html.setAttribute('data-theme', next);
    localStorage.setItem('recital-theme', next);
    updateCSSVars();
    renderChips();
    renderDropdown();
    renderLegend();
    renderRows();
    updateButton();
  }

  function updateButton() {
    var dark = html.getAttribute('data-theme') === 'dark';
    icon.textContent = dark ? '☀️' : '🌙';
    label.textContent = dark ? 'Switch to light mode' : 'Switch to dark mode';
  }

  // ── Init ──────────────────────────────────────────────────────────────────
  updateCSSVars();
  updateButton();
  loadState();
  buildSelector();
  renderRows();
  renderLegend();
  </script>

</body>
</html>
